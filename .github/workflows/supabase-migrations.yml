name: Supabase migrations

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: lmvkezxtahkizurhizbk
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  # En cada PR: valida que las migraciones nuevas aplican limpio contra el
  # proyecto remoto, sin modificar nada (dry run).
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link proyecto de Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry run de migraciones pendientes
        run: supabase db push --dry-run
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Al hacer merge/push a main (o al disparar manualmente desde la pestaña
  # Actions): aplica las migraciones nuevas al proyecto real.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link proyecto de Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar migraciones
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
